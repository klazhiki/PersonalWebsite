name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  PAGES_BRANCH: main
  PAGES_DOMAIN: ethanjoseph.dev

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify GitHub Pages settings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type')"
          cname="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.cname // ""')"
          https_enforced="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.https_enforced')"
          page_url="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.html_url // ""')"

          if [ "$build_type" != "workflow" ]; then
            echo "::error::Expected GitHub Pages build_type=workflow, got '$build_type'."
            exit 1
          fi

          if [ "$cname" != "$PAGES_DOMAIN" ]; then
            echo "::error::Expected GitHub Pages cname='$PAGES_DOMAIN', got '$cname'."
            exit 1
          fi

          if [ "$https_enforced" != "true" ]; then
            echo "::error::Expected GitHub Pages https_enforced=true."
            exit 1
          fi

          if [ "$page_url" != "https://$PAGES_DOMAIN/" ]; then
            echo "::error::Expected GitHub Pages html_url='https://$PAGES_DOMAIN/', got '$page_url'."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Copy SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./dist"

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
