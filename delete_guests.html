<!DOCTYPE html>
<html>
<head>
  <title>Deleting Guest Entries...</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body style="background:#000319;color:white;font-family:sans-serif;padding:40px;">
  <h1>Guest Entry Cleanup</h1>
  <pre id="log">Starting...</pre>
  <script>
    (async function() {
      var log = document.getElementById('log');
      function addLog(msg) { log.textContent += '\n' + msg; }
      try {
        var SUPABASE_URL = 'https://vgrivhkkmlmojefmunwh.supabase.co';
        var SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZncml2aGtrbWxtb2plZm11bndoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM0NjM0MjIsImV4cCI6MjA4OTAzOTQyMn0.VYkHro0eGRWxuB4uJ73dpD-lPAusxbQAguxMHoT68rc';
        var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
        addLog('Supabase client created.');

        // Delete Guest entries from cookie_leaderboard
        var r1 = await sb.from('cookie_leaderboard').delete().like('username', 'Guest%');
        if (r1.error) {
          addLog('cookie_leaderboard ERROR: ' + r1.error.message);
        } else {
          addLog('cookie_leaderboard: All Guest entries deleted successfully.');
        }

        // Delete Guest entries from c4_leaderboard  
        var r2 = await sb.from('c4_leaderboard').delete().like('username', 'Guest%');
        if (r2.error) {
          addLog('c4_leaderboard ERROR: ' + r2.error.message);
        } else {
          addLog('c4_leaderboard: All Guest entries deleted successfully.');
        }

        addLog('\nDone! You can close this page.');
        document.title = 'DONE - Guest entries deleted';
      } catch(e) {
        addLog('Exception: ' + e.message);
        document.title = 'ERROR - ' + e.message;
      }
    })();
  </script>
</body>
</html>
